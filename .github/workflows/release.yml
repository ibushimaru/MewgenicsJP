name: Build Release ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Assemble release ZIP
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          FOLDER="MewgenicsJP-${VERSION}"
          mkdir -p "build/${FOLDER}"

          cp install.bat "build/${FOLDER}/"
          cp uninstall.bat "build/${FOLDER}/"
          cp README.txt "build/${FOLDER}/"
          cp version.dll "build/${FOLDER}/"
          cp MewgenicsJP_progress.exe "build/${FOLDER}/"
          cp -r MewgenicsJP "build/${FOLDER}/"

          cd build
          zip -r "../MewgenicsJP-${VERSION}.zip" "${FOLDER}/"
          cd ..

          echo "=== ZIP contents ==="
          unzip -l "MewgenicsJP-${VERSION}.zip" | tail -10
          ls -lh "MewgenicsJP-${VERSION}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MewgenicsJP-${{ steps.version.outputs.VERSION }}.zip
          name: Mewgenics 日本語MOD ${{ steps.version.outputs.VERSION }}
          body: |
            ## インストール方法

            1. `MewgenicsJP-${{ steps.version.outputs.VERSION }}.zip` をダウンロード
            2. 任意の場所に展開
            3. `install.bat` をダブルクリック

            **v2.0 から Python 不要になりました。**
            初回起動時に自動で日本語化されます（数秒かかります）。

            詳しくは ZIP 内の `README.txt` を参照してください。
          draft: false
          prerelease: false
